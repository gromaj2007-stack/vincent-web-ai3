.tag{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#ddbaed;font-size:13px}
a{position:fixed;top:14px;right:14px;color:white;text-decoration:none;border:1px solid #a864df;border-radius:25px;padding:10px 14px;background:#311342bb}
@keyframes breathe{50%{transform:translateY(-8px)}}@keyframes blink{0%,43%,46%,100%{transform:scaleY(1)}44.5%{transform:scaleY(.08)}}@keyframes talk{0%,65%,100%{transform:scaleY(1)}70%{transform:scaleY(1.4)}75%{transform:scaleY(.7)}}@keyframes glow{50%{opacity:.6;filter:drop-shadow(0 0 10px #d68cff)}}
