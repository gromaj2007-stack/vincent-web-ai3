<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vivi 6.5 · KI-Texturtest</title><style>*{box-sizing:border-box}body{margin:0;background:#12091c;color:white;font:14px system-ui,sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:0;left:0;padding:14px;pointer-events:none;text-shadow:0 2px 6px #000}h1{font-size:18px;margin:0 0 4px}#status{font-size:12px;color:#e6baff}nav{position:fixed;bottom:12px;left:10px;right:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:10px;border-radius:18px;background:#261436e8}button{border:1px solid #8155b2;background:#41245c;color:white;border-radius:14px;padding:10px 12px;font:inherit}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><canvas id="view"></canvas><header><h1>Vivi 6.5 · KI-Texturtest</h1><div id="status">Texturiertes Modell wird geladen …</div></header><nav><button id="front">Vorne</button><button id="face">Gesicht nah</button><button id="side">Profil</button><button id="back">Hinten</button><button id="reset">Zurücksetzen</button><button id="turn">Drehen: Aus</button></nav><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const canvas=document.querySelector('#view'),status=document.querySelector('#status');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;const scene=new THREE.Scene();scene.background=new THREE.Color('#12091c');const camera=new THREE.PerspectiveCamera(35,1,.01,100);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.minDistance=.25;controls.maxDistance=6;controls.autoRotateSpeed=1.2;
scene.add(new THREE.HemisphereLight(0xffffff,0x57436a,2.1));const key=new THREE.DirectionalLight(0xffffff,2.3);key.position.set(2,3,4);scene.add(key);const rim=new THREE.DirectionalLight(0x9f6cff,1.1);rim.position.set(-2,1,-3);scene.add(rim);
let center=new THREE.Vector3(),size=new THREE.Vector3(),dist=3;function aim(x,y,z,tx=center.x,ty=center.y,tz=center.z){controls.target.set(tx,ty,tz);camera.position.set(x,y,z);camera.lookAt(controls.target);controls.update()}function front(){aim(center.x,center.y+.04,center.z+dist)}new GLTFLoader().load('./vivi_textured.glb',g=>{const model=g.scene;scene.add(model);const box=new THREE.Box3().setFromObject(model);box.getCenter(center);box.getSize(size);dist=Math.max(size.x,size.y,size.z)*1.5;controls.minDistance=.22;controls.maxDistance=8;front();status.textContent='KI-Modell geladen · ohne zusätzliche Gesichtsmaske';setTimeout(()=>{status.textContent='Mit einem Finger drehen · mit zwei Fingern zoomen'},3500)},p=>{if(p.total)status.textContent='Laden: '+Math.round(p.loaded/p.total*100)+' %'},e=>{status.textContent='Fehler beim Laden: '+e.message;console.error(e)});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();document.querySelector('#front').onclick=front;document.querySelector('#face').onclick=()=>aim(center.x,center.y+size.y*.30,center.z+.66,center.x,center.y+size.y*.30,center.z);document.querySelector('#side').onclick=()=>aim(center.x+.75,center.y+size.y*.30,center.z,center.x,center.y+size.y*.30,center.z);document.querySelector('#back').onclick=()=>aim(center.x,center.y,center.z-dist);document.querySelector('#reset').onclick=()=>{controls.autoRotate=false;document.querySelector('#turn').textContent='Drehen: Aus';front()};document.querySelector('#turn').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.textContent='Drehen: '+(controls.autoRotate?'An':'Aus')};window.addEventListener('unhandledrejection',e=>status.textContent='Fehler: '+e.reason);
</script></body></html>
