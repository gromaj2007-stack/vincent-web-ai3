<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160c24"><title>Vivi Lite – Animationsprototyp</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 35%,#43205e,#1b102d 55%,#090812);font-family:system-ui,sans-serif;color:#f6eaff;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}h1{font-size:1.35rem;margin:20px 0 3px;color:#e9baff}p{margin:0 14px 12px;color:#bca9d1;text-align:center;font-size:.84rem}.stage{position:relative;width:min(94vw,540px);height:min(57dvh,470px);display:grid;place-items:center;overflow:hidden;border-radius:28px;background:radial-gradient(ellipse,#a14be41b,transparent 70%)}.aura{position:absolute;width:76%;height:75%;border-radius:50%;background:#a441ff40;filter:blur(52px);animation:aura 4s ease-in-out infinite alternate}.vivi{position:relative;width:100%;height:100%;display:grid;place-items:center;transform-origin:50% 75%;animation:breath 4.3s ease-in-out infinite}.vivi img{width:100%;height:100%;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 8px 18px #ae4fff70)}.vivi.talk{animation:talk .38s ease-in-out infinite alternate}.vivi.happy{transform:rotate(-3deg)}@keyframes breath{0%,100%{transform:translateY(3px) rotate(-.5deg)}50%{transform:translateY(-4px) rotate(.6deg)}}@keyframes talk{from{transform:translateY(1px) rotate(-.7deg)}to{transform:translateY(-3px) rotate(.8deg)}}@keyframes aura{from{opacity:.35;transform:scale(.9)}to{opacity:.75;transform:scale(1.1)}}.panel{width:min(94vw,540px);padding:16px;background:#1e1533c9;border:1px solid #71459b;border-radius:18px;margin:4px 0 18px;display:grid;gap:10px}button,textarea,select{font:inherit;color:#f5eaff;border:1px solid #9165bd;background:#36204d;border-radius:12px;padding:11px}button{cursor:pointer}button:active{transform:scale(.98)}.buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.buttons button{font-size:.88rem}textarea{width:100%;min-height:62px;resize:vertical}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.85rem}input{accent-color:#bc78ff}.status{min-height:20px;color:#cba5eb;font-size:.8rem;text-align:center}@media(prefers-reduced-motion:reduce){.vivi,.vivi.talk,.aura{animation:none!important}}
</style></head><body><h1>Vivi Lite 💜</h1><p>2D-Animationsprototyp · Offline-Grafiken · Sprachtest</p><div class="stage"><div class="aura"></div><div class="vivi" id="vivi"><img id="face" src="assets/pose0.png" alt="Vivi mit lila Haaren und Headset"></div></div><div class="panel"><div class="buttons"><button id="neutral">Neutral</button><button id="smile">Lächeln</button><button id="laugh">Lachen</button></div><label class="row">Automatische Mimik <input id="auto" type="checkbox" checked></label><label class="row">Bewegungsgeschwindigkeit <input id="speed" type="range" min="50" max="150" value="100"></label><textarea id="message">Hallo! Ich bin Vivi. Schön, dass du da bist!</textarea><div class="buttons" style="grid-template-columns:1fr 1fr"><button id="speak">▶ Sprechen</button><button id="stop">■ Stoppen</button></div><div id="status" class="status" role="status">Bereit</div></div><script>
(()=>{'use strict';const face=document.getElementById('face'),vivi=document.getElementById('vivi'),status=document.getElementById('status'),auto=document.getElementById('auto'),speed=document.getElementById('speed');const frames=Array.from({length:9},(_,i)=>'assets/pose'+i+'.png');frames.forEach(src=>{const img=new Image();img.src=src});let active=0,speaking=false,lastChange=0,blinkAt=performance.now()+2400,talkAt=0;function show(i){if(i===active)return;active=i;face.src=frames[i]}function choose(i){auto.checked=false;show(i)}document.getElementById('neutral').onclick=()=>choose(0);document.getElementById('smile').onclick=()=>choose(6);document.getElementById('laugh').onclick=()=>choose(3);function loop(t){requestAnimationFrame(loop);const k=100/Number(speed.value);if(speaking){if(t-talkAt>170*k){show([1,2,7,2,1,0][Math.floor(t/(170*k))%6]);talkAt=t}return}if(!auto.checked)return;if(t>blinkAt){show(5);blinkAt=t+2500+Math.random()*2600;lastChange=t;return}if(t-lastChange>650*k){show([0,6,0,8,0][Math.floor(t/(650*k))%5]);lastChange=t}}requestAnimationFrame(loop);let utterance=null;function stop(){speaking=false;vivi.classList.remove('talk');if('speechSynthesis' in window)speechSynthesis.cancel();show(0);status.textContent='Bereit'}document.getElementById('stop').onclick=stop;document.getElementById('speak').onclick=()=>{stop();if(!('speechSynthesis'in window)){status.textContent='Sprachausgabe in diesem Browser nicht verfügbar';return}const msg=document.getElementById('message').value.trim();if(!msg)return;utterance=new SpeechSynthesisUtterance(msg);utterance.lang='de-DE';utterance.rate=.95;utterance.pitch=1.18;utterance.onstart=()=>{speaking=true;vivi.classList.add('talk');status.textContent='Vivi spricht …'};utterance.onend=()=>{speaking=false;vivi.classList.remove('talk');show(6);status.textContent='Fertig'};utterance.onerror=()=>{speaking=false;vivi.classList.remove('talk');status.textContent='Sprachausgabe fehlgeschlagen'};speechSynthesis.speak(utterance)};window.addEventListener('pagehide',stop)})();
</script></body></html>
