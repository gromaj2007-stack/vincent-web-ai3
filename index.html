<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vivi · Gesichtsatelier 6.3</title><style>*{box-sizing:border-box}body{margin:0;background:#11091d;color:#f8efff;font:15px system-ui,sans-serif}header{position:absolute;top:0;left:0;right:0;padding:16px;z-index:2;pointer-events:none}h1{font-size:19px;margin:0 0 4px}small{color:#cbb3e0}#view{width:100vw;height:100dvh;display:block;touch-action:none}#status{position:absolute;top:75px;left:16px;color:#dfc9ee;pointer-events:none}nav{position:absolute;bottom:16px;left:12px;right:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px;background:#1e1031e8;border:1px solid #563b6e;border-radius:20px}button{color:#fff;background:#3b2456;border:1px solid #8d5fb1;border-radius:18px;padding:10px 14px;font:inherit}button:active{background:#7846a1}aside{position:absolute;right:12px;top:65px;z-index:4;width:min(270px,85vw);padding:14px;background:#241335f2;border:1px solid #865bb0;border-radius:15px}aside[hidden]{display:none}aside label{display:block;font-size:13px;margin:12px 0}aside input{display:block;width:100%;accent-color:#ac67e6}aside small{display:block;margin-top:8px}nav{z-index:3}</style></head><body><header><h1>Vivi · Gesichtsatelier 6.3</h1><small>Mit einem Finger drehen · Mit zwei Fingern zoomen</small></header><div id="status">Modell wird geladen …</div><canvas id="view"></canvas><nav><button id="faceToggle">Gesicht: Neu</button><button id="front">Vorne</button><button id="portrait">Gesicht nah</button><button id="profile">Profil</button><button id="snapshot">Foto speichern</button><button id="edit">Anpassen</button><button id="blink">Blinzeln: An</button><button id="speak">Sprechen: Aus</button><button id="expression">Mimik: Neutral</button><button id="back">Hinten</button><button id="reset">Ansicht zurücksetzen</button><button id="rotate">Automatisch drehen: Aus</button></nav><aside id="panel" hidden><strong>Gesicht feinjustieren</strong><label>Links / rechts <input id="faceX" type="range" min="-0.10" max="0.10" step="0.002" value="0"></label><label>Höhe <input id="faceY" type="range" min="-0.12" max="0.12" step="0.002" value="0"></label><label>Tiefe <input id="faceZ" type="range" min="-0.12" max="0.12" step="0.002" value="0"></label><label>Größe <input id="faceScale" type="range" min="0.65" max="1.35" step="0.01" value="1"></label><label>Augengröße <input id="eyeSize" type="range" min="0.75" max="1.30" step="0.01" value="1"></label><label>Gesichtsfläche anzeigen <input id="skinVisible" type="checkbox" checked></label><button id="fitReset">Korrekturen zurücksetzen</button><button id="saveFit">Einstellungen sichern</button><small>Änderungen bleiben auf diesem Gerät gespeichert.</small></aside><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script>window.addEventListener('error',e=>{document.querySelector('#status').textContent='JavaScript-Fehler: '+e.message});window.addEventListener('unhandledrejection',e=>{document.querySelector('#status').textContent='Ladefehler: '+(e.reason?.message||e.reason)});setTimeout(()=>{const el=document.querySelector('#status');if(el&&el.textContent.includes('wird geladen'))el.textContent='Laden dauert zu lange. Bitte GitHub-Pages-Adresse und Internetverbindung prüfen.'},15000);</script><script type="module">
import * as THREE from 'three';
import {makeFace} from './face.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#view'), status=document.querySelector('#status');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.9;renderer.setClearColor(0x11091d);const scene=new THREE.Scene();scene.background=new THREE.Color(0x11091d);const camera=new THREE.PerspectiveCamera(35,1,.01,100);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=.7;controls.maxDistance=8;controls.autoRotate=false;controls.autoRotateSpeed=1.2;scene.add(new THREE.HemisphereLight(0xffffff,0x352b48,1.25));const key=new THREE.DirectionalLight(0xffffff,1.35);key.position.set(2,3,4);scene.add(key);const fill=new THREE.DirectionalLight(0x9a65ff,.35);fill.position.set(-3,1,-2);scene.add(fill);let distance=3,center=new THREE.Vector3(),faceLayer;let blinkEnabled=true,eyeSize=1,blinkClock=0,speaking=false;const fitDefault={x:0,y:0,z:0,scale:1};let fit={...fitDefault};try{fit={...fit, ...JSON.parse(localStorage.getItem("vivi_face_fit_54")||"{}")}}catch(e){}function applyFit(){if(!faceLayer)return;faceLayer.position.set(fit.x,fit.y,fit.z);faceLayer.scale.setScalar(fit.scale);for(const [key,id] of [["x","faceX"],["y","faceY"],["z","faceZ"],["scale","faceScale"]])document.getElementById(id).value=fit[key];}for(const [key,id] of [["x","faceX"],["y","faceY"],["z","faceZ"],["scale","faceScale"]])document.getElementById(id).oninput=e=>{fit[key]=Number(e.target.value);applyFit();localStorage.setItem("vivi_face_fit_54",JSON.stringify(fit))};const loader=new GLTFLoader();loader.load('./vivi_refined.glb',g=>{const model=g.scene;scene.add(model);const face=makeFace(THREE);faceLayer=face;model.add(face);applyFit();const savedEye=Number(localStorage.getItem('vivi_eye_size_55')||1);document.getElementById('eyeSize').value=Number.isFinite(savedEye)?savedEye:1;setEyeSize(Number.isFinite(savedEye)?savedEye:1);const box=new THREE.Box3().setFromObject(model);box.getCenter(center);const size=box.getSize(new THREE.Vector3());const max=Math.max(size.x,size.y,size.z);distance=max*2.3;controls.target.copy(center);camera.position.set(center.x,center.y+max*.05,center.z+distance);controls.minDistance=max*.7;controls.maxDistance=max*5;camera.near=Math.max(.001,max/1000);camera.far=max*30;camera.updateProjectionMatrix();controls.update();status.textContent='Gesicht 6.3 geladen (noch ungetestet)';setTimeout(()=>status.remove(),2200);},e=>{if(e.total)status.textContent='Lade Modell: '+Math.round(e.loaded/e.total*100)+' %';},e=>{status.textContent='GLB-Ladefehler: '+e.message;console.error(e)});
function setEyeSize(v){eyeSize=v;if(faceLayer)faceLayer.userData.setEyeSize(v);}
document.getElementById('eyeSize').oninput=e=>{setEyeSize(Number(e.target.value));localStorage.setItem('vivi_eye_size_55',e.target.value)};
document.getElementById('skinVisible').onchange=e=>{if(faceLayer)for(const o of faceLayer.userData.features.skin)o.visible=e.target.checked};
document.getElementById('blink').onclick=e=>{blinkEnabled=!blinkEnabled;e.currentTarget.textContent='Blinzeln: '+(blinkEnabled?'An':'Aus');if(!blinkEnabled&&faceLayer)faceLayer.userData.setBlink(0)};
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();if(faceLayer&&faceLayer.visible){const t=performance.now()/1000;const phase=t%4.7;const b=blinkEnabled&&phase<.24?Math.pow(Math.sin(Math.PI*phase/.24),1.3):0;faceLayer.userData.setBlink(b);faceLayer.userData.setGaze(Math.sin(t*.64)*.7,Math.sin(t*.39)*.45);}if(faceLayer&&faceLayer.visible&&speaking)faceLayer.userData.setSpeaking(Math.max(0,Math.min(1,.35+.3*Math.sin(performance.now()*.011)+.2*Math.sin(performance.now()*.023))));renderer.render(scene,camera)}animate();document.querySelector('#faceToggle').onclick=e=>{if(!faceLayer)return;faceLayer.visible=!faceLayer.visible;e.currentTarget.textContent='Gesicht: '+(faceLayer.visible?'Neu':'Original')};const moods=['neutral','happy','curious','surprised'];const moodLabels=['Neutral','Fröhlich','Neugierig','Überrascht'];let moodIndex=0;document.querySelector('#expression').onclick=e=>{moodIndex=(moodIndex+1)%moods.length;if(faceLayer)faceLayer.userData.setExpression(moods[moodIndex]);e.currentTarget.textContent='Mimik: '+moodLabels[moodIndex]};document.querySelector('#speak').onclick=e=>{speaking=!speaking;if(faceLayer)faceLayer.userData.setSpeaking(0);e.currentTarget.textContent='Sprechen: '+(speaking?'Demo':'Aus')};document.querySelector('#edit').onclick=()=>{const panel=document.getElementById('panel');panel.hidden=!panel.hidden};document.querySelector('#saveFit').onclick=()=>{const data={version:'6.3',fit,eyeSize,diagnostics:faceLayer?.userData.getFaceDiagnostics?.()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vivi-gesicht-einstellungen.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.querySelector('#fitReset').onclick=()=>{fit={...fitDefault};applyFit();setEyeSize(1);document.getElementById('eyeSize').value=1;localStorage.removeItem('vivi_eye_size_55');localStorage.removeItem('vivi_face_fit_54')};document.querySelector('#portrait').onclick=()=>{controls.target.set(0,.66,.08);camera.position.set(0,.68,.92);camera.lookAt(controls.target);controls.update()};document.querySelector('#profile').onclick=()=>{controls.target.set(0,.66,.08);camera.position.set(.90,.66,.08);camera.lookAt(controls.target);controls.update()};document.querySelector('#snapshot').onclick=()=>{renderer.render(scene,camera);canvas.toBlob(blob=>{if(!blob){alert('Bild konnte nicht gespeichert werden');return;}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vivi-gesicht-6-3.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)},'image/png')};document.querySelector('#front').onclick=()=>{camera.position.set(center.x,center.y,center.z+distance);controls.update()};document.querySelector('#back').onclick=()=>{camera.position.set(center.x,center.y,center.z-distance);controls.update()};document.querySelector('#reset').onclick=()=>{controls.autoRotate=false;document.querySelector('#rotate').textContent='Automatisch drehen: Aus';camera.position.set(center.x,center.y+distance*.05,center.z+distance);controls.target.copy(center);controls.update()};document.querySelector('#rotate').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.textContent='Automatisch drehen: '+(controls.autoRotate?'An':'Aus')};
</script></body></html>
