<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13091f"><title>Vivi · Video-Nachbau 4.0</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0717;color:#fff;font:14px system-ui,-apple-system,sans-serif}#view{position:absolute;inset:0;touch-action:none}#view canvas{display:block;width:100%;height:100%}.top{position:absolute;top:15px;left:17px;pointer-events:none;text-shadow:0 2px 12px #000}.top strong{font-size:17px}.top small{display:block;color:#dcb4ff;margin-top:3px}#status{position:absolute;top:69px;left:17px;color:#e6d2ff;font-size:12px;pointer-events:none}.panel{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(96%,650px);display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:8px;border:1px solid #ab68e055;border-radius:17px;background:#130b22d9;backdrop-filter:blur(12px)}button{border:1px solid #8954b8;background:#271537;color:white;border-radius:13px;padding:9px 11px;font:inherit;cursor:pointer}button[aria-pressed="true"]{background:#7940b0;border-color:#db9cff}.quality{color:#d4b1ee;font-size:12px;padding:0 4px}@media(max-width:520px){.panel{gap:5px;padding:7px}button{font-size:12px;padding:8px 9px}.top strong{font-size:15px}}
#referenceImage{position:absolute;right:12px;top:12px;width:min(28vw,190px);max-height:52vh;object-fit:contain;border:1px solid #b771df;border-radius:12px;box-shadow:0 4px 30px #000a;display:none;pointer-events:none}#referenceImage.visible{display:block}@media(max-width:600px){#referenceImage{width:30vw;top:58px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="view"></div><img id="referenceImage" src="./vorlage.png" alt="Bestätigte Vivi-Designvorlage"><div class="top"><strong>Vivi · Video-Nachbau 4.0</strong><small>Finger: drehen · Zwei Finger: zoomen</small></div><div id="status">Modell wird geladen …</div><div class="panel" id="panel"><button data-preset="cinema" aria-pressed="true">💜 Kino</button><button data-preset="studio" aria-pressed="false">✨ Studio</button><button data-preset="neon" aria-pressed="false">🌌 Neon</button><button id="glow" aria-pressed="false">Glow: Aus</button><button id="spin">Drehen: Aus</button><button id="front">Vorne</button><button id="reference">Vorlage zeigen</button><span class="quality" id="quality"></span></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const $=id=>document.getElementById(id), container=$('view');
const scene=new THREE.Scene();scene.background=new THREE.Color('#10071c');
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(0,.3,11.4);
const mobile=/Android|iPhone|iPad/i.test(navigator.userAgent);const pixelRatio=Math.min(devicePixelRatio,mobile?1.3:1.8);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:false});renderer.setPixelRatio(pixelRatio);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.66;renderer.shadowMap.enabled=false;container.appendChild(renderer.domElement);
const envGen=new THREE.PMREMGenerator(renderer);const env=envGen.fromScene(new RoomEnvironment(),.045);scene.environment=env.texture;scene.environmentIntensity=.35;envGen.dispose();
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.2,0);controls.enableDamping=true;controls.dampingFactor=.075;controls.minDistance=6;controls.maxDistance=18;controls.maxPolarAngle=Math.PI*.76;controls.update();
const lights={};function directional(name,color,intensity,pos){const l=new THREE.DirectionalLight(color,intensity);l.position.set(...pos);scene.add(l);lights[name]=l}
lights.ambient=new THREE.HemisphereLight(0xf6e9ff,0x211027,0.48);scene.add(lights.ambient);
directional('key',0xffe8f9,1.25,[-3,5,6]);directional('fill',0x8d64ff,.38,[4,1,5]);directional('rim',0xc34aff,1.15,[3,3,-4]);directional('hair',0xffa8fa,.65,[-4,2,-3]);directional('under',0x7e38e9,.10,[0,-3,4]);
// A subtle backdrop halo is geometry behind the model, not an image of the character.
const haloMaterial=new THREE.MeshBasicMaterial({color:0x552077,transparent:true,opacity:.22,depthWrite:false});const halo=new THREE.Mesh(new THREE.SphereGeometry(2.9,48,24),haloMaterial);halo.position.set(0,.25,-3.4);halo.scale.set(1,1,.07);scene.add(halo);
let composer=null,bloom=null,glow=false,spinning=false,model=null,mode='cinema';
try{composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.46,.58,.84);composer.addPass(bloom);composer.addPass(new OutputPass());}catch(e){glow=false;$('glow').disabled=true;console.warn('Postprocessing nicht verfügbar',e)}
const presets={cinema:{background:'#10071c',exposure:.66,ambient:.48,key:1.25,fill:.38,rim:1.15,hair:.65,under:.10,bloom:.12,halo:.12},studio:{background:'#1b1128',exposure:.72,ambient:.75,key:1.45,fill:.55,rim:.65,hair:.4,under:.10,bloom:.06,halo:.06},neon:{background:'#090419',exposure:.58,ambient:.36,key:1.0,fill:.3,rim:1.9,hair:1.1,under:.20,bloom:.2,halo:.14}};
function applyPreset(p){mode=p;const a=presets[p];scene.background.set(a.background);renderer.toneMappingExposure=a.exposure;Object.keys(lights).forEach(k=>lights[k].intensity=a[k]);haloMaterial.opacity=a.halo;if(bloom)bloom.strength=a.bloom;document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preset===p)))}
function tuneMaterial(obj){if(!obj.isMesh)return;const n=obj.name.toLowerCase();const materials=Array.isArray(obj.material)?obj.material:[obj.material];for(const mat of materials){if(!mat)return;mat.side=THREE.DoubleSide;if(!mat.isMeshStandardMaterial)continue;mat.envMapIntensity=n.includes('hair')?.48:n.includes('metal')||n.includes('ear')?.7: .28;mat.metalness=n.includes('hair')?.08:n.includes('metal')||n.includes('ear')?.30:n.includes('jacket')?.03:0;mat.roughness=n.includes('hair')?.48:n.includes('metal')||n.includes('ear')?.36:n.includes('eye')||n.includes('iris')?.28:n.includes('skin')||n.includes('face')?.78:.75;
// Only designated neon objects emit light. Avoid blowing out the pale skin and white shirt.
if(/glow|piping|headphone_heart|earring|jacket_heart|catchlight|glint|iris_ray|collar_light/.test(n)){mat.emissive=new THREE.Color(n.includes('white')||n.includes('catchlight')?0xffdfff:0x9c22f0);mat.emissiveIntensity=n.includes('glow')?.55: .23;}
mat.needsUpdate=true;}}
new GLTFLoader().load('./vivi_video_rebuild.glb',g=>{model=g.scene;model.traverse(tuneMaterial);scene.add(model);$('status').textContent='Eigenständiger Video-Nachbau geladen';},undefined,e=>{$('status').textContent='Ladefehler: Bitte über GitHub Pages öffnen.';console.error(e)});
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>applyPreset(b.dataset.preset));$('glow').onclick=()=>{glow=!glow;$('glow').textContent='Glow: '+(glow?'An':'Aus');$('glow').setAttribute('aria-pressed',String(glow))};$('spin').onclick=()=>{spinning=!spinning;$('spin').textContent='Drehen: '+(spinning?'An':'Aus')};$('front').onclick=()=>{camera.position.set(0,.3,11.4);controls.target.set(0,.2,0);if(model)model.rotation.y=0;controls.update()};
$('reference').onclick=()=>{$('referenceImage').classList.toggle('visible');$('reference').textContent=$('referenceImage').classList.contains('visible')?'Vorlage ausblenden':'Vorlage zeigen'};
$('quality').textContent=mobile?'Mobil optimiert':'Hohe Qualität';applyPreset('cinema');
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(spinning&&model)model.rotation.y+=dt*.34;controls.update();if(composer&&glow)composer.render();else renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);if(composer)composer.setSize(w,h);if(bloom)bloom.setSize(w,h)});
</script></body></html>
