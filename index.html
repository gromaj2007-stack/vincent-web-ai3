<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>Vivi 7.1 – Detailmodell</title><style>html,body{margin:0;height:100%;background:#10091c;color:#f6eaff;font:16px system-ui}canvas{display:block}header{position:absolute;top:12px;left:14px;z-index:2;font-weight:700;text-shadow:0 2px 6px #000}nav{position:absolute;bottom:15px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}button{background:#38214d;border:1px solid #8759a8;color:white;border-radius:20px;padding:11px 15px;font:inherit}small{display:block;font-size:12px;font-weight:400}#status{position:absolute;top:62px;left:14px;color:#dfb7ff;font-size:13px}</style></head><body><header>Vivi 7.1 · Detailmodell<small>Originaltexturen + neu modellierte Gesichtselemente</small></header><div id="status">3D-Modell wird geladen …</div><nav><button id="front">Vorne</button><button id="face">Gesicht nah</button><button id="side">Profil</button><button id="reset">Ganzkörper</button><button id="spin">Drehen: Aus</button></nav><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=0.85;document.body.appendChild(r.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#10091c');const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,30);const ctrl=new OrbitControls(cam,r.domElement);ctrl.enableDamping=true;ctrl.autoRotate=false;scene.add(new THREE.HemisphereLight(0xece2ff,0x302039,2.0));function light(color,intensity,x,y,z){let l=new THREE.DirectionalLight(color,intensity);l.position.set(x,y,z);scene.add(l)}light(0xffffff,1.7,2,3,5);light(0x9985cc,.65,-3,1,2);light(0xffffff,.5,0,2,-4);let model;new GLTFLoader().load('./vivi_detail.glb',g=>{model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh&&o.material){o.material.side=THREE.DoubleSide;if(o.material.metalness!==undefined)o.material.metalness=Math.min(o.material.metalness,.25);o.material.needsUpdate=true}});document.getElementById('status').textContent='Modell geladen';view('reset')},undefined,e=>{document.getElementById('status').textContent='Ladefehler: '+e.message});function view(v){if(!model)return;let target=new THREE.Vector3(0,v==='face'||v==='side'?.62:0,0);let distance=v==='face'?.63:v==='side'?.69:3.0;cam.position.set(v==='side'?.69:0,target.y+(v==='reset'?.1:0),v==='side'?.06:distance);ctrl.target.copy(target);ctrl.update()}for(let n of ['front','face','side','reset'])document.getElementById(n).onclick=()=>view(n);document.getElementById('spin').onclick=e=>{ctrl.autoRotate=!ctrl.autoRotate;e.target.textContent='Drehen: '+(ctrl.autoRotate?'An':'Aus')};addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});function tick(){requestAnimationFrame(tick);ctrl.update();r.render(scene,cam)}tick();</script></body></html>
