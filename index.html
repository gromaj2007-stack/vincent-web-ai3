<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#170a28"><title>Vivi Lite 2.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#10071c;color:#f8eaff;font:16px system-ui,sans-serif}
main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 43%,#52236e 0%,#1d0d30 48%,#10071c 85%);overflow:hidden}
h1{font-size:22px;margin:16px 0 0;letter-spacing:.04em}.hint{font-size:12px;color:#d2b4e4;margin:3px 0}
.stage{position:relative;width:min(100vw,500px);height:min(67dvh,650px);min-height:340px;display:grid;place-items:center;isolation:isolate;overflow:hidden}
.stage:before{content:"";position:absolute;inset:15%;border-radius:50%;background:#b338ff44;filter:blur(65px);animation:aura 4s ease-in-out infinite alternate}
@keyframes aura{to{opacity:.45;transform:scale(1.08)}}
.character{position:relative;width:min(100%,calc(min(67dvh,650px) * 1199 / 1312));aspect-ratio:1199/1312;height:auto;transform-origin:50% 82%;animation:breathe 5.4s ease-in-out infinite;will-change:transform}
@keyframes breathe{0%,100%{transform:translateY(4px) rotate(-.4deg) scale(1)}50%{transform:translateY(-4px) rotate(.55deg) scale(1.009)}}
 .character img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 22px #0009)}
.face{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.eye-shut,.talk-mouth{opacity:0;transition:opacity .065s linear}
.character.blink .eye-shut,.character.speaking .talk-mouth{opacity:1}
.character.speaking .talk-mouth{transform-box:fill-box;transform-origin:center;animation:talk .17s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.48)}to{transform:scaleY(1.12)}}
.controls{position:relative;width:min(94vw,500px);border:1px solid #8d53b3;border-radius:20px;padding:14px;margin:0 0 22px;background:#1e1030e8;box-shadow:0 8px 35px #0005}
.buttons{display:flex;gap:8px;flex-wrap:wrap}button{flex:1;border:1px solid #b17ada;border-radius:12px;background:#38204f;color:white;padding:12px;font:inherit;cursor:pointer;min-width:95px}button:active{background:#653585}
textarea{width:100%;margin:10px 0;padding:12px;border-radius:12px;border:1px solid #9861b9;background:#301b43;color:white;font:inherit;resize:vertical}
label{display:flex;gap:10px;align-items:center;margin:12px 0}input[type=range]{flex:1;min-width:80px;accent-color:#ba77fa}
small{display:block;text-align:center;margin-top:10px;color:#d1b2e4}
@media(prefers-reduced-motion:reduce){.character,.stage:before{animation:none!important}}
</style></head><body><main><h1>Vivi Lite 2.1 💜</h1><p class="hint">Korrigierte Gesichtspunkte · Animationsvorschau</p>

<section class="controls"><div class="buttons"><button id="neutral">Neutral</button><button id="smile">Lächeln</button><button id="blink">Blinzeln</button></div>
<label><input id="auto" type="checkbox" checked> Automatisches Blinzeln</label><label>Bewegung <input id="speed" type="range" min=".5" max="2" step=".1" value="1"></label>
<textarea id="message" rows="2">Hallo! Ich bin Vivi. Schön, dass du da bist!</textarea>
<div class="buttons"><button id="speak">▶ Sprechen</button><button id="stop">■ Stoppen</button></div><small id="status">Bereit · Browser-Stimme</small></section></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),v=$('vivi'),status=$('status');let speaking=false;
function blink(){v.classList.add('blink');setTimeout(()=>v.classList.remove('blink'),150)}
$('blink').onclick=blink;
$('neutral').onclick=()=>{v.style.filter='none';status.textContent='Neutral'};
$('smile').onclick=()=>{v.style.filter='brightness(1.07) saturate(1.1)';status.textContent='Freundlich'};
$('speed').oninput=e=>v.style.animationDuration=(5.4/Number(e.target.value)).toFixed(2)+'s';
function loop(){if($('auto').checked&&!document.hidden)blink();setTimeout(loop,2400+Math.random()*3100)}setTimeout(loop,2000);
function stop(){speaking=false;v.classList.remove('speaking');if('speechSynthesis'in window)speechSynthesis.cancel();status.textContent='Bereit'}
$('stop').onclick=stop;
$('speak').onclick=()=>{stop();if(!('speechSynthesis'in window)){status.textContent='Sprachausgabe nicht unterstützt';return}
const text=$('message').value.trim();if(!text)return;
const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.98;u.pitch=1.1;
u.onstart=()=>{speaking=true;v.classList.add('speaking');status.textContent='Vivi spricht (Mundbewegung angenähert)'};
const done=()=>{speaking=false;v.classList.remove('speaking');status.textContent='Fertig'};u.onend=done;u.onerror=done;
speechSynthesis.speak(u)};
})();
</script></body></html>
