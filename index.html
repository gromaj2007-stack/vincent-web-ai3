<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vivi · Meshy 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#11091d;color:#f8efff;font:15px system-ui,sans-serif}header{position:absolute;top:0;left:0;right:0;padding:16px;z-index:2;pointer-events:none}h1{font-size:19px;margin:0 0 4px}small{color:#cbb3e0}#view{width:100vw;height:100dvh;display:block;touch-action:none}#status{position:absolute;top:75px;left:16px;color:#dfc9ee;pointer-events:none}nav{position:absolute;bottom:16px;left:12px;right:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px;background:#1e1031e8;border:1px solid #563b6e;border-radius:20px}button{color:#fff;background:#3b2456;border:1px solid #8d5fb1;border-radius:18px;padding:10px 14px;font:inherit}button:active{background:#7846a1}</style></head><body><header><h1>Vivi · Meshy 3D</h1><small>Mit einem Finger drehen · Mit zwei Fingern zoomen</small></header><div id="status">Modell wird geladen …</div><canvas id="view"></canvas><nav><button id="front">Vorne</button><button id="back">Hinten</button><button id="reset">Ansicht zurücksetzen</button><button id="rotate">Automatisch drehen: Aus</button></nav><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script>window.addEventListener('error',e=>{document.querySelector('#status').textContent='JavaScript-Fehler: '+e.message});window.addEventListener('unhandledrejection',e=>{document.querySelector('#status').textContent='Ladefehler: '+(e.reason?.message||e.reason)});setTimeout(()=>{const el=document.querySelector('#status');if(el&&el.textContent.includes('wird geladen'))el.textContent='Laden dauert zu lange. Bitte GitHub-Pages-Adresse und Internetverbindung prüfen.'},15000);</script><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#view'), status=document.querySelector('#status');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.9;renderer.setClearColor(0x11091d);const scene=new THREE.Scene();scene.background=new THREE.Color(0x11091d);const camera=new THREE.PerspectiveCamera(35,1,.01,100);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=.7;controls.maxDistance=8;controls.autoRotate=false;controls.autoRotateSpeed=1.2;scene.add(new THREE.HemisphereLight(0xf5e7ff,0x24112e,2));const key=new THREE.DirectionalLight(0xffffff,2.0);key.position.set(2,3,4);scene.add(key);const fill=new THREE.DirectionalLight(0x9a65ff,.75);fill.position.set(-3,1,-2);scene.add(fill);let distance=3,center=new THREE.Vector3();const loader=new GLTFLoader();loader.load('./vivi.glb',g=>{const model=g.scene;scene.add(model);const box=new THREE.Box3().setFromObject(model);box.getCenter(center);const size=box.getSize(new THREE.Vector3());const max=Math.max(size.x,size.y,size.z);distance=max*2.3;controls.target.copy(center);camera.position.set(center.x,center.y+max*.05,center.z+distance);controls.minDistance=max*.7;controls.maxDistance=max*5;camera.near=Math.max(.001,max/1000);camera.far=max*30;camera.updateProjectionMatrix();controls.update();status.textContent='3D-Modell geladen';setTimeout(()=>status.remove(),2200);},e=>{if(e.total)status.textContent='Lade Modell: '+Math.round(e.loaded/e.total*100)+' %';},e=>{status.textContent='GLB-Ladefehler: '+e.message;console.error(e)});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();document.querySelector('#front').onclick=()=>{camera.position.set(center.x,center.y,center.z+distance);controls.update()};document.querySelector('#back').onclick=()=>{camera.position.set(center.x,center.y,center.z-distance);controls.update()};document.querySelector('#reset').onclick=()=>{controls.autoRotate=false;document.querySelector('#rotate').textContent='Automatisch drehen: Aus';camera.position.set(center.x,center.y+distance*.05,center.z+distance);controls.target.copy(center);controls.update()};document.querySelector('#rotate').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.textContent='Automatisch drehen: '+(controls.autoRotate?'An':'Aus')};
</script></body></html>
