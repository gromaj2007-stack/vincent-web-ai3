<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vivi Alive</title><style>body{margin:0;background:#130c20;color:#eee;font:16px system-ui;min-height:100dvh;display:grid;place-items:center;text-align:center}#status{padding:20px}</style></head><body><div id="status">Vivi wird geladen …</div><script>
(async()=>{try{
const url='https://raw.githubusercontent.com/gromaj2007-stack/vincent-web-ai3/a2a53c04ec/index.html';
const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('Originalversion HTTP '+res.status);
let source=await res.text();if(!source.includes('vivi-rig-v28.js')||!source.includes('app.js'))throw Error('Originaldatei unerwartet');
// Keep the original AI, chat, voice and memory scripts unchanged.
// Resolve the relative assets against the existing GitHub Pages deployment.
source=source.replace(/<head>/i,'<head><base href="https://gromaj2007-stack.github.io/vincent-web-ai3/">');
source=source.replace(/<\/body>/i,'<script src="./vivi-face-fix.js?v=4" defer></'+'script></body>');
document.open();document.write(source);document.close();
}catch(e){document.getElementById('status').textContent='Vivi konnte nicht geladen werden: '+e.message;}})();
</script></body></html>
