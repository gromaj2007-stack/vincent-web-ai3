<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10091c"><title>Vivi 2.5D AI</title><link rel="manifest" href="./manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 35%,#392452,#10091c 72%);color:#f6eaff;font:15px system-ui,sans-serif;overflow:hidden}#stage{position:fixed;inset:0}#stage canvas{display:block}header{position:fixed;top:env(safe-area-inset-top,12px);left:16px;z-index:2;text-shadow:0 2px 8px #000}header strong{font-size:19px}#status{font-size:12px;color:#ddc2ff;margin-top:5px;max-width:75vw}#controls{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px;z-index:3;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}button,input,select{font:inherit}button{background:#38214de8;border:1px solid #9b6bc5;color:white;border-radius:20px;padding:10px 13px;cursor:pointer}button:disabled{opacity:.45}#panel{position:fixed;right:12px;top:65px;z-index:4;width:min(360px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#21152ef5;border:1px solid #8e60a8;border-radius:17px;padding:15px;box-shadow:0 8px 30px #0009}#panel[hidden]{display:none}#panel label{display:block;margin:10px 0 5px}#panel input,#panel select{width:100%;padding:10px;background:#140e1e;border:1px solid #8664a2;border-radius:9px;color:white}#panel button{margin-top:8px}#reply{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:2;max-width:min(650px,90vw);padding:9px 13px;border-radius:14px;background:#1a1029d9;text-align:center;display:none}#reply.show{display:block}@media(max-height:440px){#panel{top:10px;max-height:75vh}#reply{bottom:65px}}
</style></head><body><div id="stage"></div><header><strong>Vivi 2.5D AI</strong><div id="status" role="status">Starte Vivi …</div></header><div id="reply" aria-live="polite"></div><div id="controls"><button id="talk">🎤 Sprechen</button><button id="thought">💬 Gedanke</button><button id="settings">⚙ Einstellungen</button></div><section id="panel" hidden><strong>Vivi · Einstellungen</strong><label for="prompt">Nachricht</label><input id="prompt" placeholder="Frag Vivi etwas …"><button id="send">Senden</button><label for="brain">KI-Gehirn</label><select id="brain"><option value="cloud">Online (Puter)</option><option value="local">Lokal (Qwen2.5 / WebGPU)</option></select><button id="load">Lokales Gehirn laden</button><label for="voice">Sprachausgabe</label><select id="voice"><option value="browser">Browserstimme</option><option value="mute">Stumm</option></select><button id="close">Schließen</button><button id="clear">Gedächtnis löschen</button><p id="memoryCount"></p><small>Lokale KI benötigt WebGPU und einen Modelldownload. Online-KI kann eine Anmeldung erfordern. Mikrofon nur nach Antippen.</small></section><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),status=$('status'),reply=$('reply');const state={speaking:false,thinking:false,listen:false};let model=null,head=null,mouth=null,eyes=[],blinkUntil=0,nextBlink=performance.now()+2500;const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,40);camera.position.set(0,.65,2.6);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1; $('stage').append(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.enablePan=false;orbit.minDistance=.65;orbit.maxDistance=6;orbit.target.set(0,.45,0);scene.add(new THREE.HemisphereLight(0xece2ff,0x302039,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,3,5);scene.add(light);const rim=new THREE.DirectionalLight(0x9985cc,1);rim.position.set(-3,1,-2);scene.add(rim);
new GLTFLoader().load('./vivi_detail.glb',g=>{model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh&&o.material){o.material.side=THREE.DoubleSide;o.material.needsUpdate=true}});const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());model.position.sub(center);const height=Math.max(size.y,.1);model.scale.setScalar(1.75/height);const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3());orbit.target.set(0,s.y*.08,0);camera.position.set(0,s.y*.10,Math.max(1.9,s.y*1.4));orbit.update();const objects=[];model.traverse(o=>{if(o.isObject3D)objects.push(o)});head=objects.find(o=>/head|kopf/i.test(o.name));mouth=objects.find(o=>/mouth|lip|mund/i.test(o.name));eyes=objects.filter(o=>/eye|auge|lid/i.test(o.name));status.textContent='Vivi ist bereit';},undefined,e=>status.textContent='3D-Modell konnte nicht geladen werden: '+e.message);
let t=0;function animate(){requestAnimationFrame(animate);t+=.016;const now=performance.now();if(model){model.rotation.y=Math.sin(t*.42)*.055;model.rotation.z=Math.sin(t*.7)*.012;model.position.y=Math.sin(t*1.3)*.018;if(head)head.rotation.y=Math.sin(t*.55)*.045;if(mouth)mouth.scale.y=state.speaking?.75+Math.abs(Math.sin(t*12))*.9:1;if(now>nextBlink){blinkUntil=now+125;nextBlink=now+2100+Math.random()*3000}for(const eye of eyes){if(/lid|eyelid/i.test(eye.name))continue;eye.scale.y=now<blinkUntil?.12:1}}orbit.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const KEY='vincent_memory_v3',TOPICS='vincent_topics_v5';const read=(key)=>{try{const x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x:[]}catch{return []}};const save=(key,data)=>localStorage.setItem(key,JSON.stringify(data));function show(text){reply.textContent=text;reply.classList.add('show');}function speak(text){show(text);if($('voice').value==='mute'||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.95;u.pitch=1.08;u.onstart=()=>{state.speaking=true;status.textContent='Vivi spricht'};const done=()=>{state.speaking=false;status.textContent='Vivi ist bereit'};u.onend=done;u.onerror=done;speechSynthesis.speak(u)}
let worker=null,ready=false,seq=0;const jobs=new Map();function loadLocal(){if(!('gpu'in navigator)){status.textContent='WebGPU ist nicht verfügbar';return}if(worker){worker.postMessage({type:'load'});return}worker=new Worker('./brain-worker.js',{type:'module'});worker.onmessage=e=>{const d=e.data||{};if(d.type==='progress')status.textContent=d.message||'Lade KI …';if(d.type==='ready'){ready=true;status.textContent='Lokales Gehirn bereit'}if(d.type==='error'){status.textContent='KI-Fehler: '+d.message;const j=jobs.get(d.id);if(j){jobs.delete(d.id);j.reject(Error(d.message))}}if(d.type==='reply'){const j=jobs.get(d.id);if(j){jobs.delete(d.id);j.resolve(d.reply)}}};worker.onerror=()=>{ready=false;status.textContent='KI-Worker fehlgeschlagen'};worker.postMessage({type:'load'})}function localAI(message){if(!ready)throw Error('Lokales Gehirn noch nicht geladen');return new Promise((resolve,reject)=>{const id=++seq;const timer=setTimeout(()=>{jobs.delete(id);reject(Error('KI-Zeitüberschreitung'))},90000);jobs.set(id,{resolve:v=>{clearTimeout(timer);resolve(v)},reject:e=>{clearTimeout(timer);reject(e)}});worker.postMessage({type:'generate',id,payload:{message,mode:'chat',memories:read(KEY).slice(-8),topics:read(TOPICS).slice(-4)}})})}
async function cloudAI(message){if(!window.puter?.ai?.chat){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://js.puter.com/v2/';s.onload=resolve;s.onerror=()=>reject(Error('Online-KI nicht erreichbar'));document.head.append(s)})}const prompt='Du bist Vivi, ein frecher, freundlicher und respektvoller deutschsprachiger KI-Begleiter. Antworte natürlich und erfinde keine Erinnerungen. Erinnerungen: '+read(KEY).slice(-12).join(' | ')+'\nNutzer: '+message+'\nVivi:';const r=await window.puter.ai.chat(prompt);const content=typeof r==='string'?r:r?.message?.content||r?.text||r?.content||'';return Array.isArray(content)?content.map(x=>x.text||'').join(' '):String(content)}
async function respond(message){message=String(message||'').trim();if(!message||state.thinking)return;const m=message.match(/(?:merk dir|merke dir)(?: bitte)?[,:]?\s*(.+)/i);if(m){save(KEY,[...read(KEY),m[1].slice(0,400)].slice(-150));speak('Das habe ich mir gemerkt.');return}save(TOPICS,[...read(TOPICS),message.slice(0,140)].slice(-8));state.thinking=true;status.textContent='Vivi denkt …';try{const answer=$('brain').value==='local'?await localAI(message):await cloudAI(message);speak(answer||'Mir fällt gerade keine Antwort ein.')}catch(e){status.textContent='KI nicht verfügbar: '+e.message;show('KI nicht verfügbar: '+e.message)}finally{state.thinking=false}}
$('settings').onclick=()=>{$('panel').hidden=false;$('memoryCount').textContent='Gespeicherte Erinnerungen: '+read(KEY).length};$('close').onclick=()=>{$('panel').hidden=true};$('send').onclick=()=>{const m=$('prompt').value;$('prompt').value='';respond(m)};$('prompt').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('load').onclick=loadLocal;$('clear').onclick=()=>{if(confirm('Alle gespeicherten Erinnerungen wirklich löschen?')){localStorage.removeItem(KEY);$('memoryCount').textContent='Gespeicherte Erinnerungen: 0'}};$('thought').onclick=()=>respond('Sag einen kurzen, originellen Gedanken.');$('brain').value=localStorage.getItem('vincent_brain_mode')||'cloud';$('brain').onchange=()=>localStorage.setItem('vincent_brain_mode',$('brain').value);
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;$('talk').onclick=()=>{if(!Recognition){status.textContent='Spracherkennung in diesem Browser nicht verfügbar';return}if(state.listen)return;const r=new Recognition();r.lang='de-DE';r.interimResults=false;r.onstart=()=>{state.listen=true;status.textContent='Vivi hört zu …'};r.onresult=e=>respond(e.results[0][0].transcript);r.onerror=e=>status.textContent='Mikrofon: '+e.error;r.onend=()=>{state.listen=false;if(!state.thinking&&!state.speaking)status.textContent='Vivi ist bereit'};try{r.start()}catch(e){status.textContent=e.message}};
</script></body></html>
